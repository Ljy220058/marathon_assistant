<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>M-EXRx Trace Viewer</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; line-height: 1.45; }
    textarea { width: 100%; min-height: 180px; font-family: Consolas, monospace; }
    button { padding: 8px 12px; }
    pre { background: #f5f5f5; padding: 12px; overflow: auto; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .cell { border: 1px solid #ccc; padding: 12px; }
    .row { margin: 10px 0; }
    .error { color: #8a1f11; background: #fff4f0; border: 1px solid #e0a899; padding: 10px; }
    .muted { color: #555; }
    select, input { padding: 6px; }
  </style>
</head>
<body>
  <h1>M-EXRx Trace Viewer</h1>
  <p class="muted">Open this file after cloning or downloading the artifact. GitHub's file preview shows source code; it does not run local HTML as an interactive page.</p>
  <p>Paste one JSON result from <code>demo/run_demo.py</code>, a result item, or a full benchmark run containing a <code>results</code> array.</p>
  <div class="row">
    <input id="file" type="file" accept=".json,.jsonl,application/json">
    <select id="caseSelect" onchange="selectCase()"></select>
  </div>
  <textarea id="input">{
  "case_id": "mexrx-024",
  "system": "full_rule_governed",
  "status": "refused",
  "plan": "Training prescription refused: a red-flag rule was triggered.",
  "trace": {
    "case_id": "mexrx-024",
    "profile_version": "p4",
    "risk_level": "R3",
    "rules_fired": ["risk.R3", "refusal.medical_boundary", "contract.no_training_prescription"],
    "evidence_ids": ["risk.redflag.heat_illness"],
    "action_ids": [],
    "expert_calls": [],
    "audit_result": "pass",
    "repair_log": [],
    "final_status": "refused"
  }
}</textarea>
  <p><button onclick="render()">Render</button></p>
  <div id="out"></div>
  <script>
    let currentResults = [];

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, function (ch) {
        return ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'})[ch];
      });
    }

    function parseInput() {
      const raw = document.getElementById('input').value.trim();
      if (!raw) throw new Error('Paste a JSON result or load a JSON file first.');
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed)) return { item: parsed[0], results: parsed };
      if (Array.isArray(parsed.results)) return { item: parsed.results[0], results: parsed.results };
      return { item: parsed, results: [parsed] };
    }

    function updateCaseSelect(results, selectedCaseId) {
      currentResults = results || [];
      const select = document.getElementById('caseSelect');
      select.innerHTML = '';
      currentResults.forEach(function (item, index) {
        const option = document.createElement('option');
        option.value = String(index);
        option.textContent = item.case_id || ('item-' + (index + 1));
        if (item.case_id === selectedCaseId) option.selected = true;
        select.appendChild(option);
      });
    }

    function selectCase() {
      const select = document.getElementById('caseSelect');
      const item = currentResults[Number(select.value)];
      if (!item) return;
      document.getElementById('input').value = JSON.stringify(item, null, 2);
      render();
    }

    function render() {
      const out = document.getElementById('out');
      try {
        const parsed = parseInput();
        const data = parsed.item || {};
        const trace = data.trace || {};
        updateCaseSelect(parsed.results, data.case_id);
        out.innerHTML = `
        <div class="grid">
          <div class="cell"><b>Case</b><pre>${escapeHtml(data.case_id || trace.case_id || '')}</pre></div>
          <div class="cell"><b>Status</b><pre>${escapeHtml(data.status || trace.final_status || '')}</pre></div>
          <div class="cell"><b>Risk</b><pre>${escapeHtml(trace.risk_level || '')}</pre></div>
          <div class="cell"><b>Audit</b><pre>${escapeHtml(trace.audit_result || '')}</pre></div>
          <div class="cell"><b>Rules Fired</b><pre>${escapeHtml(JSON.stringify(trace.rules_fired || [], null, 2))}</pre></div>
          <div class="cell"><b>Evidence / Actions</b><pre>${escapeHtml(JSON.stringify({evidence_ids: trace.evidence_ids || [], action_ids: trace.action_ids || []}, null, 2))}</pre></div>
          <div class="cell"><b>Expert Calls</b><pre>${escapeHtml(JSON.stringify(trace.expert_calls || [], null, 2))}</pre></div>
          <div class="cell"><b>Repair Log</b><pre>${escapeHtml(JSON.stringify(trace.repair_log || [], null, 2))}</pre></div>
        </div>
        <h2>Final Output</h2>
        <pre>${escapeHtml(data.plan || '')}</pre>
      `;
      } catch (err) {
        out.innerHTML = '<div class="error"><b>Could not render JSON.</b><br>' + escapeHtml(err.message) + '</div>';
      }
    }

    document.getElementById('file').addEventListener('change', function (event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function () {
        document.getElementById('input').value = String(reader.result || '');
        render();
      };
      reader.readAsText(file);
    });

    render();
  </script>
</body>
</html>
