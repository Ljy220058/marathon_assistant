[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marathon-qa-assistant"
version = "0.1.0"
description = "FastAPI and RAG backend for the marathon assistant monorepo."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0,<0.136",
    "uvicorn[standard]>=0.30.6,<0.42",
    "sse-starlette>=2.1.3,<3",
    "langgraph>=0.2.53,<2",
    "langchain-ollama>=1.1.0,<2",
    "langchain-core>=1.4.0,<2",
    "pydantic>=2.9.2,<3",
    "faiss-cpu>=1.7.4,<2",
    "openai>=1.30.0,<3",
    "markdown>=3.4.0,<4",
    "pandas>=2.0.0,<3",
    "numpy>=1.24.0,<3",
    "python-dotenv>=1.0.0,<2",
    "httpx>=0.24.0,<1",
    "python-json-logger>=2.0.0,<4",
    "cryptography>=41.0.0,<48",
]

[project.optional-dependencies]
ocr = [
    "python-docx>=0.8.11,<2",
    "PyMuPDF>=1.23.0,<2",
    "paddlepaddle>=2.6.0,<3",
    "paddleocr>=2.7.0,<3",
    "Pillow>=10.0.0,<12",
    "python-magic-bin>=0.4.14; platform_system == 'Windows'",
    "python-magic>=0.4.27; platform_system != 'Windows'",
]
eval = [
    "ragas>=0.1.0,<0.3",
    "datasets>=2.18.0,<4",
]
dev = [
    "pytest>=7.0.0,<9",
    "pytest-cov>=4.1.0,<6",
    "ruff>=0.6.0,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["marathon_qa_assistant*"]

[tool.pytest.ini_options]
pythonpath = ["src", "../.."]
