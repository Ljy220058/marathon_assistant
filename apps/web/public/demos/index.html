<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MUJI 风格前端 Demo 集合</title>
    <link rel="stylesheet" href="./demos.css" />
  </head>
  <body>
    <main class="shell">
      <h1 class="page-title">5 个 MUJI 参考版 HTML Demo</h1>
      <p class="page-subtitle">
        都是不做上方菜单栏锚点跳转的版本。每个方案都偏日式克制、低噪音，但信息架构不同。
      </p>

      <section class="index-grid">
        <a class="demo-link" href="./muji-plan-focus.html">
          <strong>方案 A / 单任务首屏</strong>
          <small>最保守。默认只做“生成训练日历”，聊天和依据都下沉。</small>
        </a>
        <a class="demo-link" href="./muji-sidebar-workspace.html">
          <strong>方案 B / 左侧导航工作区</strong>
          <small>最像产品。左侧切视图，右侧单工作区，不做页面滚动导航。</small>
        </a>
        <a class="demo-link" href="./journal/index.html">
          <strong>方案 C / 训练日志板</strong>
          <small>细化版。包含 3 套配色/组件方向，每套都带点击后的多页面流转。</small>
        </a>
        <a class="demo-link" href="./muji-editorial-quiet.html">
          <strong>方案 D / 编辑式安静界面</strong>
          <small>更像 MUJI HOTEL 那种安静空间感，适合高端感，但效率稍低。</small>
        </a>
        <a class="demo-link" href="./muji-mobile-first.html">
          <strong>方案 E / 窄屏优先</strong>
          <small>针对你当前实机窄屏形态，底部固定主动作，首屏更直接。</small>
        </a>
      </section>
    </main>
  </body>
</html>
