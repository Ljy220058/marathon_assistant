<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>C1 / Stone Quiet / 首页</title>
    <link rel="stylesheet" href="./journal.css" />
  </head>
  <body class="theme-stone">
    <main class="journal-shell">
      <header class="journal-topbar">
        <div class="journal-brand">
          <div class="journal-brand-mark">M</div>
          <div class="journal-brand-copy">
            <strong>马拉松助手</strong>
            <span>Stone Quiet / 首页</span>
          </div>
        </div>
        <div class="journal-toolbar">
          <span class="journal-pill">服务离线</span>
          <a class="journal-pill" href="./index.html">返回方向选择</a>
        </div>
      </header>

      <section class="journal-hero">
        <h1>先生成计划，再看解释。</h1>
        <p>这个版本最接近 MUJI：安静、克制、按钮少。顶部不做锚点导航，只有一个主动作。</p>
      </section>

      <section class="journal-layout">
        <aside class="journal-sidebar">
          <p class="journal-sidebar-title">工作视图</p>
          <nav class="journal-nav">
            <a class="is-active" href="./stone-home.html">训练计划</a>
            <a href="./stone-profile.html">我的情况</a>
            <a href="./stone-dialog.html">智能对话</a>
            <a href="./stone-basis.html">训练复盘</a>
            <a href="./stone-history.html">历史记录</a>
          </nav>
        </aside>

        <section class="journal-main">
          <article class="journal-card journal-card-pad">
            <div class="journal-section-head">
              <div>
                <p class="journal-section-kicker">第一步</p>
                <h2>训练计划</h2>
              </div>
              <span class="journal-pill">训练日历优先</span>
            </div>
            <p class="journal-subtitle">主动作只保留一个：生成训练日历。</p>
            <div class="journal-grid-2" style="margin-top: 18px;">
              <div class="journal-stat-card">
                <span>我的情况</span>
                <strong>半马完赛 / 新手 / 40 分钟</strong>
              </div>
              <div class="journal-stat-card">
                <span>当前状态</span>
                <strong>还没有计划</strong>
              </div>
            </div>
            <div class="journal-action-row" style="margin-top: 18px;">
              <a class="journal-btn primary" href="./stone-calendar.html">生成训练日历</a>
              <a class="journal-btn" href="./stone-profile.html">编辑我的情况</a>
            </div>
          </article>

          <article class="journal-card journal-card-pad">
            <div class="journal-callout">
              <strong>点击后的页面流转</strong>
              <div class="journal-caption">首页 -> 日历 -> 某一天详情 -> 依据 -> 历史</div>
            </div>
          </article>
        </section>
      </section>
    </main>
  </body>
</html>
