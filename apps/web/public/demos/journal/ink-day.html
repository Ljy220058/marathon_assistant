<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>周二训练</title>
    <link rel="stylesheet" href="./journal.css" />
    <script defer src="./journal-app.js"></script>
  </head>
  <body class="theme-ink">
    <main class="journal-shell">
      <header class="journal-topbar">
        <div class="journal-brand">
          <div class="journal-brand-mark">M</div>
          <div class="journal-brand-copy">
            <strong>马拉松助手</strong>
            <span>周二训练</span>
          </div>
        </div>
        <div class="journal-toolbar">
          <a class="journal-pill is-action" href="./ink-feedback.html">记录今天</a>
        </div>
      </header>
      <section class="journal-split">
        <article class="journal-card journal-card-pad">
          <h2>轻松跑 35 分钟</h2>
          <div class="journal-workout-meta" style="margin-top: 14px;">
            <span class="journal-badge">心率区间 2</span>
            <span class="journal-badge">配速 6'48" - 7'10"/km</span>
          </div>
          <div class="journal-day-flow" style="margin-top: 16px;">
            <div class="journal-flow-step"><strong>热身</strong><div class="journal-caption">8 分钟</div></div>
            <div class="journal-flow-step"><strong>主课</strong><div class="journal-caption">35 分钟</div></div>
            <a class="journal-flow-step" href="./ink-feedback.html"><strong>记录</strong><div class="journal-caption">心率 / 呼吸 / 疲劳</div></a>
          </div>
        </article>
        <article class="journal-card journal-card-pad">
          <h2>训练复盘</h2>
          <p class="journal-inline-note" style="margin-top: 10px;">如果周内有临时比赛，先去事件页改版本，再回来执行。</p>
          <div class="journal-action-row" style="margin-top: 18px;">
            <a class="journal-btn" href="./ink-basis.html">查看复盘</a>
            <a class="journal-btn primary" href="./ink-feedback.html">今日反馈</a>
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
