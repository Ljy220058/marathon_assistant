<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>C1 / Stone Quiet / 日历</title>
    <link rel="stylesheet" href="./journal.css" />
  </head>
  <body class="theme-stone">
    <main class="journal-shell">
      <header class="journal-topbar">
        <div class="journal-brand">
          <div class="journal-brand-mark">M</div>
          <div class="journal-brand-copy">
            <strong>马拉松助手</strong>
            <span>Stone Quiet / 日历</span>
          </div>
        </div>
        <div class="journal-toolbar">
          <span class="journal-pill">第 1 周</span>
          <a class="journal-pill" href="./stone-home.html">返回首页</a>
        </div>
      </header>

      <section class="journal-layout">
        <aside class="journal-sidebar">
          <p class="journal-sidebar-title">工作视图</p>
          <nav class="journal-nav">
            <a class="is-active" href="./stone-calendar.html">训练计划</a>
            <a href="./stone-profile.html">我的情况</a>
            <a href="./stone-dialog.html">智能对话</a>
            <a href="./stone-basis.html">训练复盘</a>
            <a href="./stone-history.html">历史记录</a>
          </nav>
        </aside>

        <section class="journal-main">
          <section class="journal-card journal-card-pad">
            <div class="journal-section-head">
              <div>
                <p class="journal-section-kicker">本周节奏</p>
                <h2>训练日历</h2>
              </div>
              <span class="journal-pill">3 次训练</span>
            </div>
            <div class="journal-session-list">
              <a class="journal-session-card" href="./stone-day.html">
                <span>周二 / 下一次训练</span>
                <strong>轻松跑 35 分钟</strong>
                <div class="journal-meta">以能说完整句子的强度完成。点击进入当天详情。</div>
              </a>
              <div class="journal-session-card">
                <span>周四</span>
                <strong>间歇跑 6 × 400m</strong>
                <div class="journal-meta">本周唯一关键课，强调速度唤醒。</div>
              </div>
              <div class="journal-session-card">
                <span>周六</span>
                <strong>长跑 55 分钟</strong>
                <div class="journal-meta">拉长有氧时间，不追求速度。</div>
              </div>
            </div>
          </section>
        </section>
      </section>
    </main>
  </body>
</html>
