<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>C1 / Stone Quiet / 当天详情</title>
    <link rel="stylesheet" href="./journal.css" />
  </head>
  <body class="theme-stone">
    <main class="journal-shell">
      <header class="journal-topbar">
        <div class="journal-brand">
          <div class="journal-brand-mark">M</div>
          <div class="journal-brand-copy">
            <strong>马拉松助手</strong>
            <span>Stone Quiet / 周二详情</span>
          </div>
        </div>
        <div class="journal-toolbar">
          <a class="journal-pill" href="./stone-calendar.html">返回日历</a>
        </div>
      </header>

      <section class="journal-hero">
        <h1>轻松跑 35 分钟</h1>
        <p>当天页面只回答三件事：今天练什么、为什么这样练、练完怎么记。</p>
      </section>

      <section class="journal-split">
        <article class="journal-card journal-card-pad">
          <div class="journal-day-flow">
            <div class="journal-flow-step">
              <strong>热身</strong>
              <div class="journal-caption">步行 5 分钟，慢跑 8 分钟。</div>
            </div>
            <div class="journal-flow-step">
              <strong>主课</strong>
              <div class="journal-caption">持续 35 分钟轻松跑，能说完整句子。</div>
            </div>
            <div class="journal-flow-step">
              <strong>结束</strong>
              <div class="journal-caption">慢走 5 分钟，做小腿和髂胫束放松。</div>
            </div>
          </div>
          <div class="journal-action-row" style="margin-top: 18px;">
            <a class="journal-btn primary" href="./stone-basis.html">查看训练复盘</a>
            <a class="journal-btn" href="./stone-history.html">记录反馈</a>
          </div>
        </article>

        <article class="journal-card journal-card-pad">
          <h2>为什么这样练</h2>
          <p class="journal-subtitle">本次不是为了提高速度，而是建立稳定的有氧节奏和恢复余量。</p>
          <div class="journal-callout" style="margin-top: 16px;">
            <strong>今天的判断标准</strong>
            <div class="journal-caption">如果你喘得厉害，说明今天跑快了。宁可慢，也不要变成节奏跑。</div>
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
