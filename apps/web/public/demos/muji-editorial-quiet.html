<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>方案 D / 编辑式安静界面</title>
    <link rel="stylesheet" href="./demos.css" />
  </head>
  <body>
    <div class="demo-layout">
      <main class="shell">
        <header class="topbar">
          <div class="brand">
            <span class="brand-mark">M</span>
            <span>马拉松助手</span>
          </div>
          <div class="status">Quiet Mode</div>
        </header>

        <section class="grid-two" style="margin-top: 28px;">
          <article class="hero">
            <h1>训练，不一定要被很多界面打断。</h1>
            <p>这个方案更接近 MUJI HOTEL 的安静空间感。适合做高端感，但交互效率会比方案 B 低一点。</p>
            <div class="button-row">
              <a class="btn primary" href="#">生成本周计划</a>
              <a class="btn" href="#">查看我的情况</a>
            </div>
          </article>

          <aside class="figure">
            <img src="../assets/images/project_image.png" alt="Quiet layout reference" />
          </aside>
        </section>

        <section class="columns-3" style="margin-top: 20px;">
          <article class="mini">
            <strong>核心动作</strong>
            <div class="meta">只让用户先完成一件事。</div>
          </article>
          <article class="mini">
            <strong>页面情绪</strong>
            <div class="meta">弱提示、弱边框、强留白。</div>
          </article>
          <article class="mini">
            <strong>适用性</strong>
            <div class="meta">更适合品牌化展示，不是最强工作流方案。</div>
          </article>
        </section>
      </main>
    </div>
  </body>
</html>
