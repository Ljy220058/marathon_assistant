<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; rx: 18; ry: 18; }
      .node { fill: #ffffff; stroke: #334155; stroke-width: 2.5; rx: 16; ry: 16; }
      .node-core { fill: #eef2ff; stroke: #4338ca; stroke-width: 3; rx: 18; ry: 18; }
      .node-risk { fill: #fff7ed; stroke: #ea580c; stroke-width: 3; rx: 16; ry: 16; }
      .node-evidence { fill: #eff6ff; stroke: #2563eb; stroke-width: 3; rx: 16; ry: 16; }
      .node-audit { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 3; rx: 16; ry: 16; }
      .node-output { fill: #ecfdf5; stroke: #059669; stroke-width: 3; rx: 16; ry: 16; }
      .node-light { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; rx: 14; ry: 14; }
      .title { font: 700 26px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #475569; }
      .label { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .small { font: 400 14px Arial, sans-serif; fill: #334155; }
      .tiny { font: 400 12px Arial, sans-serif; fill: #475569; }
      .arrow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .arrow-risk { stroke: #ea580c; stroke-width: 3; fill: none; marker-end: url(#arrowheadRisk); }
      .arrow-evidence { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrowheadEvidence); }
      .arrow-audit { stroke: #7c3aed; stroke-width: 3; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrowheadAudit); }
      .tag { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; ry: 10; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#334155"/>
    </marker>
    <marker id="arrowheadRisk" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#ea580c"/>
    </marker>
    <marker id="arrowheadEvidence" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowheadAudit" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1100"/>

  <text class="title" x="80" y="70">Rule-Governed M-EXRx Agent</text>
  <text class="subtitle" x="80" y="100">Risk-aware multi-expert exercise prescription with evidence gating, contract generation, and independent auditing</text>

  <rect class="panel" x="50" y="130" width="1700" height="500"/>
  <text class="label" x="80" y="170">Governed Reasoning Path</text>

  <rect class="node-light" x="90" y="220" width="190" height="90"/>
  <text class="label" x="145" y="255">User Query</text>
  <text class="tiny" x="112" y="282">goals, constraints, history</text>

  <rect class="node-risk" x="330" y="210" width="220" height="110"/>
  <text class="label" x="398" y="245">RiskGate</text>
  <text class="tiny" x="354" y="272">red flags, fatigue, injury</text>
  <text class="tiny" x="354" y="292">prompt injection, noisy wearables</text>

  <rect class="node-evidence" x="610" y="210" width="230" height="110"/>
  <text class="label" x="670" y="245">EvidenceGate</text>
  <text class="tiny" x="635" y="272">answerable / partial / unanswerable</text>
  <text class="tiny" x="635" y="292">retrieve, block, or ask more</text>

  <rect class="node-core" x="910" y="205" width="280" height="120"/>
  <text class="label" x="980" y="240">PrescriptionContract</text>
  <text class="tiny" x="942" y="268">FITT-VP, phase, capacity budget,</text>
  <text class="tiny" x="942" y="288">constraints, evidence needs</text>

  <rect class="node" x="1260" y="205" width="300" height="120"/>
  <text class="label" x="1322" y="240">Dynamic Expert Panel</text>
  <text class="tiny" x="1295" y="268">default: Evidence Steward, HMP Coach, Auditor</text>
  <text class="tiny" x="1295" y="288">conditional: Safety/Rehab, Nutrition</text>

  <rect class="node-output" x="1580" y="205" width="120" height="120"/>
  <text class="label" x="1601" y="245">Final</text>
  <text class="label" x="1595" y="268">Plan</text>
  <text class="tiny" x="1598" y="292">+ Trace</text>

  <path class="arrow" d="M 280 265 L 330 265"/>
  <path class="arrow-risk" d="M 550 265 L 610 265"/>
  <path class="arrow-evidence" d="M 840 265 L 910 265"/>
  <path class="arrow" d="M 1190 265 L 1260 265"/>
  <path class="arrow" d="M 1560 265 L 1580 265"/>

  <rect class="tag" x="330" y="345" width="220" height="38"/>
  <text class="tiny" x="355" y="369">R0/R1/R2/R3 risk level</text>
  <rect class="tag" x="610" y="345" width="230" height="38"/>
  <text class="tiny" x="640" y="369">tier policy + citation validity</text>
  <rect class="tag" x="910" y="345" width="280" height="38"/>
  <text class="tiny" x="946" y="369">contract before generation</text>

  <rect class="tag" x="1278" y="365" width="108" height="34"/>
  <text class="tiny" x="1303" y="387">Coach</text>
  <rect class="tag" x="1398" y="365" width="108" height="34"/>
  <text class="tiny" x="1418" y="387">S&amp;C</text>
  <rect class="tag" x="1518" y="365" width="108" height="34"/>
  <text class="tiny" x="1538" y="387">Rehab</text>
  <rect class="tag" x="1638" y="365" width="108" height="34"/>
  <text class="tiny" x="1656" y="387">Nutrition</text>
  <text class="subtitle" x="1235" y="435">High-risk cases activate Safety/Rehab; fueling cases activate Nutrition. Low-risk cases stay on the fast path.</text>

  <rect class="panel" x="50" y="660" width="470" height="360"/>
  <text class="label" x="80" y="700">Independent Audit</text>
  <rect class="node-audit" x="90" y="730" width="370" height="110"/>
  <text class="label" x="175" y="765">Rule Auditor /</text>
  <text class="label" x="152" y="790">Conflict Arbitrator</text>
  <text class="tiny" x="125" y="817">validates rules, citations, repairs, vetoes</text>
  <text class="small" x="90" y="880">Priority order:</text>
  <text class="tiny" x="90" y="908">medical red flags &gt; safety &gt; evidence gate</text>
  <text class="tiny" x="90" y="930">protocol rules &gt; capacity budget &gt; user goals</text>
  <text class="tiny" x="90" y="952">performance optimization &gt; wording preference</text>

  <rect class="panel" x="560" y="660" width="1190" height="360"/>
  <text class="label" x="590" y="700">Layered Knowledge Base</text>

  <rect class="node-light" x="600" y="735" width="240" height="90"/>
  <text class="label" x="635" y="770">Protocol Rules</text>
  <text class="tiny" x="625" y="797">HMP, FITT-VP, safety, capacity</text>

  <rect class="node-light" x="870" y="735" width="240" height="90"/>
  <text class="label" x="910" y="770">Action Library</text>
  <text class="tiny" x="897" y="797">approved workout templates</text>

  <rect class="node-light" x="1140" y="735" width="240" height="90"/>
  <text class="label" x="1172" y="770">Safety / Rehab KB</text>
  <text class="tiny" x="1165" y="797">pain, injury continuum, referral</text>

  <rect class="node-light" x="1410" y="735" width="240" height="90"/>
  <text class="label" x="1450" y="770">Nutrition KB</text>
  <text class="tiny" x="1438" y="797">fueling, hydration, recovery</text>

  <rect class="node-light" x="735" y="865" width="330" height="90"/>
  <text class="label" x="795" y="900">Unified EvidenceBundle</text>
  <text class="tiny" x="760" y="927">evidence_id, tier, source, page, snippet</text>

  <rect class="node-light" x="1135" y="865" width="330" height="90"/>
  <text class="label" x="1200" y="900">Explanation-Only Sources</text>
  <text class="tiny" x="1168" y="927">academic literature, wiki context, notes</text>

  <path class="arrow-evidence" d="M 720 825 L 790 865"/>
  <path class="arrow-evidence" d="M 990 825 L 915 865"/>
  <path class="arrow-evidence" d="M 1260 825 L 990 865"/>
  <path class="arrow-evidence" d="M 1530 825 L 1365 865"/>

  <path class="arrow-evidence" d="M 900 865 C 900 600, 720 470, 725 320"/>
  <path class="arrow-evidence" d="M 1295 865 C 1295 620, 1240 455, 1100 325"/>

  <path class="arrow-audit" d="M 460 785 C 680 785, 800 640, 980 325"/>
  <path class="arrow-audit" d="M 460 785 C 760 785, 980 640, 1100 325"/>
  <path class="arrow-audit" d="M 460 785 C 930 785, 1220 640, 1390 325"/>
  <path class="arrow-audit" d="M 460 785 C 1120 785, 1400 640, 1640 325"/>

  <text class="tiny" x="80" y="1030">Figure focus: risk-aware activation + evidence gating + contract generation + independent auditing, rather than a crowded multi-agent chat.</text>
</svg>
