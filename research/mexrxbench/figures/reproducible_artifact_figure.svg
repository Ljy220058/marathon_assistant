<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1600" height="820" viewBox="0 0 1600 820" xmlns="http://www.w3.org/2000/svg">
<style>
  .title { font: 600 23px Helvetica, Arial, sans-serif; fill:#111827; }
  .section { font: 600 15px Helvetica, Arial, sans-serif; fill:#111827; }
  .label { font: 600 13px Helvetica, Arial, sans-serif; fill:#111827; }
  .body { font: 12.6px Helvetica, Arial, sans-serif; fill:#253041; }
  .muted { font: 12px Helvetica, Arial, sans-serif; fill:#667085; }
  .mono { font: 11.8px Consolas, "Courier New", monospace; fill:#253041; }
  .mono-key { font: 600 11.8px Consolas, "Courier New", monospace; fill:#253041; }
  .accent { fill:#2f5d7c; }
  .panel { fill:#ffffff; stroke:#252a31; stroke-width:1.1; }
  .node { fill:#ffffff; stroke:#252a31; stroke-width:1.0; }
  .soft { fill:#f7f8fa; stroke:#c5ccd6; stroke-width:0.9; }
  .callout { fill:#ffffff; stroke:#2f5d7c; stroke-width:1.0; }
  .line { stroke:#252a31; stroke-width:1.1; fill:none; }
  .accent-line { stroke:#2f5d7c; stroke-width:1.1; fill:none; }
  .hairline { stroke:#d6dbe3; stroke-width:0.8; fill:none; }
</style>

<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#252a31"/>
  </marker>
  <marker id="accentArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#2f5d7c"/>
  </marker>
</defs>

<rect width="1600" height="820" fill="#ffffff"/>

<text x="800" y="44" text-anchor="middle" class="title">
  Reproducible trace-governed artifact pathway
</text>

<rect x="42" y="80" width="1516" height="698" rx="2" class="panel"/>

<!-- Main verification pathway -->
<text x="76" y="124" class="section">Checking a case from input to trace evidence</text>
<line x1="76" y1="140" x2="1522" y2="140" class="hairline"/>

<rect x="86" y="182" width="205" height="92" rx="2" class="node"/>
<text x="188" y="214" text-anchor="middle" class="label">System-visible case</text>
<text x="188" y="238" text-anchor="middle" class="mono">system_visible_cases.jsonl</text>
<text x="188" y="258" text-anchor="middle" class="muted">gold fields withheld</text>

<rect x="374" y="182" width="205" height="92" rx="2" class="node"/>
<text x="476" y="214" text-anchor="middle" class="label">Reproduction command</text>
<text x="476" y="238" text-anchor="middle" class="mono">run_all.ps1</text>
<text x="476" y="258" text-anchor="middle" class="muted">single command</text>

<rect x="662" y="182" width="205" height="92" rx="2" class="node"/>
<text x="764" y="214" text-anchor="middle" class="label">Output files</text>
<text x="764" y="238" text-anchor="middle" class="mono">results + traces</text>
<text x="764" y="258" text-anchor="middle" class="muted">case-level records</text>

<rect x="950" y="182" width="205" height="92" rx="2" class="node"/>
<text x="1052" y="214" text-anchor="middle" class="label">Rule audit</text>
<text x="1052" y="238" text-anchor="middle" class="mono">RiskGate + EvidenceGate</text>
<text x="1052" y="258" text-anchor="middle" class="muted">bounded repair checked</text>

<rect x="1238" y="182" width="205" height="92" rx="2" class="node"/>
<text x="1340" y="214" text-anchor="middle" class="label">Reviewer check</text>
<text x="1340" y="238" text-anchor="middle" class="mono">metrics + trace viewer</text>
<text x="1340" y="258" text-anchor="middle" class="muted">artifact inspection</text>

<line x1="291" y1="228" x2="374" y2="228" class="line" marker-end="url(#arrow)"/>
<line x1="579" y1="228" x2="662" y2="228" class="line" marker-end="url(#arrow)"/>
<line x1="867" y1="228" x2="950" y2="228" class="line" marker-end="url(#arrow)"/>
<line x1="1155" y1="228" x2="1238" y2="228" class="line" marker-end="url(#arrow)"/>

<!-- Trace excerpt, connected to generated outputs and audit evidence -->
<line x1="764" y1="274" x2="764" y2="336" class="accent-line" marker-end="url(#accentArrow)"/>
<line x1="1052" y1="274" x2="1052" y2="336" class="accent-line" marker-end="url(#accentArrow)"/>

<rect x="516" y="326" width="784" height="236" rx="2" class="soft"/>
<text x="544" y="364" class="section">Concrete trace excerpt: mexrx-011</text>
<text x="1216" y="364" text-anchor="end" class="muted">the trace records why the answer is allowed</text>
<line x1="544" y1="382" x2="1272" y2="382" class="hairline"/>

<text x="544" y="410" class="mono-key">risk_level</text>
<text x="690" y="410" class="mono">= R2</text>
<text x="544" y="438" class="mono-key">rules_fired</text>
<text x="690" y="438" class="mono">= [risk.R2, repair.required,</text>
<text x="708" y="460" class="mono">safety.fail_closed]</text>
<text x="544" y="490" class="mono-key">evidence_ids</text>
<text x="690" y="490" class="mono">= [risk.fatigue.overload, hmp.recovery]</text>
<text x="544" y="518" class="mono-key">repair_log</text>
<text x="690" y="518" class="mono">= downgrade_or_restrict_plan -> re-audit pass</text>
<text x="544" y="546" class="mono-key">final_status</text>
<text x="690" y="546" class="mono accent">= partial_answer</text>

<rect x="982" y="410" width="262" height="88" rx="2" class="callout"/>
<text x="1113" y="438" text-anchor="middle" class="label">Repair boundary</text>
<text x="1113" y="464" text-anchor="middle" class="body">R2 permits downgrade or restriction.</text>
<text x="1113" y="484" text-anchor="middle" class="body">R3 remains fail-closed refusal.</text>

<line x1="908" y1="560" x2="908" y2="610" class="accent-line" stroke-dasharray="4,4" marker-end="url(#accentArrow)"/>
<text x="922" y="592" class="muted">stored trace record</text>

<!-- Artifact bundle strip -->
<rect x="86" y="612" width="1357" height="128" rx="2" class="soft"/>
<text x="112" y="642" class="section">Artifact provenance map</text>
<text x="342" y="642" class="muted">files used to reproduce and inspect the case</text>
<line x1="112" y1="658" x2="1418" y2="658" class="hairline"/>

<rect x="118" y="676" width="214" height="42" rx="2" class="node"/>
<text x="130" y="694" class="mono-key">benchmark/</text>
<text x="130" y="712" class="muted">system-visible cases; held-out gold</text>

<rect x="384" y="676" width="214" height="42" rx="2" class="node"/>
<text x="396" y="694" class="mono-key">reproducibility/</text>
<text x="396" y="712" class="muted">run_all.ps1 and validation logs</text>

<rect x="650" y="676" width="214" height="42" rx="2" class="node"/>
<text x="662" y="694" class="mono-key">artifacts/demo_runs/</text>
<text x="662" y="712" class="muted">stored outputs and traces</text>

<rect x="916" y="676" width="214" height="42" rx="2" class="node"/>
<text x="928" y="694" class="mono-key">rule_spec/</text>
<text x="928" y="712" class="muted">contracts and trace schema</text>

<rect x="1182" y="676" width="214" height="42" rx="2" class="node"/>
<text x="1194" y="694" class="mono-key">demo/</text>
<text x="1194" y="712" class="muted">runner and trace viewer</text>
</svg>
