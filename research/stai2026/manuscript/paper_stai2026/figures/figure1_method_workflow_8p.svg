<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="760" viewBox="0 0 1800 760">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#222"/>
    </marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#b42318"/>
    </marker>
    <style>
      .title { font: 700 44px Arial, Helvetica, sans-serif; fill: #111827; }
      .label { font: 700 26px Arial, Helvetica, sans-serif; fill: #111827; }
      .sub { font: 20px Arial, Helvetica, sans-serif; fill: #374151; }
      .small { font: 18px Arial, Helvetica, sans-serif; fill: #374151; }
      .tiny { font: 17px Arial, Helvetica, sans-serif; fill: #4b5563; }
      .box { fill: #ffffff; stroke: #111827; stroke-width: 2.2; rx: 18; }
      .blue { fill: #eff6ff; stroke: #2563eb; }
      .red { fill: #fff1f2; stroke: #dc2626; }
      .green { fill: #f0fdf4; stroke: #16a34a; }
      .orange { fill: #fff7ed; stroke: #f97316; }
      .grey { fill: #f9fafb; stroke: #6b7280; }
      .flow { stroke: #222; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .refuse { stroke: #b42318; stroke-width: 3; fill: none; stroke-dasharray: 10 8; marker-end: url(#arrowRed); }
      .repair { stroke: #7c2d12; stroke-width: 3; fill: none; stroke-dasharray: 10 8; marker-end: url(#arrow); }
      .band { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
    </style>
  </defs>

  <rect width="1800" height="760" fill="#ffffff"/>
  <text x="900" y="62" text-anchor="middle" class="title">Evidence-Gated Audit-and-Repair Workflow</text>

  <!-- Main flow boxes -->
  <rect x="38" y="132" width="150" height="118" class="box grey"/>
  <text x="113" y="178" text-anchor="middle" class="label">User</text>
  <text x="113" y="210" text-anchor="middle" class="label">Query</text>

  <rect x="242" y="118" width="205" height="146" class="box red"/>
  <text x="344.5" y="160" text-anchor="middle" class="label">Pre-Gate</text>
  <text x="344.5" y="193" text-anchor="middle" class="label">Request Filter</text>
  <text x="344.5" y="226" text-anchor="middle" class="sub">request policy</text>

  <rect x="505" y="132" width="180" height="118" class="box blue"/>
  <text x="595" y="178" text-anchor="middle" class="label">Retrieve</text>
  <text x="595" y="211" text-anchor="middle" class="label">Evidence</text>

  <rect x="743" y="118" width="190" height="146" class="box blue"/>
  <text x="838" y="160" text-anchor="middle" class="label">Evidence</text>
  <text x="838" y="193" text-anchor="middle" class="label">Gate</text>
  <text x="838" y="226" text-anchor="middle" class="sub">sufficiency</text>

  <rect x="990" y="118" width="170" height="146" class="box red"/>
  <text x="1075" y="166" text-anchor="middle" class="label">Risk</text>
  <text x="1075" y="199" text-anchor="middle" class="label">Gate</text>
  <text x="1075" y="229" text-anchor="middle" class="sub">safety</text>

  <rect x="1217" y="118" width="220" height="146" class="box green"/>
  <text x="1327" y="151" text-anchor="middle" class="label">Evidence-</text>
  <text x="1327" y="184" text-anchor="middle" class="label">Constrained</text>
  <text x="1327" y="217" text-anchor="middle" class="label">Generator</text>
  <text x="1327" y="247" text-anchor="middle" class="sub">draft only</text>

  <rect x="1495" y="118" width="222" height="146" class="box green"/>
  <text x="1606" y="151" text-anchor="middle" class="label">Independent</text>
  <text x="1606" y="184" text-anchor="middle" class="label">Grounding</text>
  <text x="1606" y="217" text-anchor="middle" class="label">Auditor</text>
  <text x="1606" y="247" text-anchor="middle" class="sub">verify claims</text>

  <rect x="1510" y="392" width="250" height="128" class="box orange"/>
  <text x="1635" y="434" text-anchor="middle" class="label">Bounded Citation/</text>
  <text x="1635" y="467" text-anchor="middle" class="label">Grounding Repair</text>
  <text x="1635" y="499" text-anchor="middle" class="sub">repair, then re-audit</text>

  <rect x="782" y="382" width="250" height="138" class="box red"/>
  <text x="907" y="432" text-anchor="middle" class="label">Refusal</text>
  <text x="907" y="466" text-anchor="middle" class="sub">safe completion</text>
  <text x="907" y="496" text-anchor="middle" class="sub">no answer produced</text>

  <rect x="39" y="610" width="1720" height="90" class="band"/>
  <text x="76" y="652" class="label">Trace states:</text>
  <text x="260" y="653" class="small">query</text>
  <text x="356" y="653" class="small">→ retrieved_evidence</text>
  <text x="608" y="653" class="small">→ evidence_state</text>
  <text x="830" y="653" class="small">→ risk_state</text>
  <text x="1006" y="653" class="small">→ generated_response</text>
  <text x="1276" y="653" class="small">→ audit_result</text>
  <text x="1484" y="653" class="small">→ final_status</text>
  <text x="76" y="684" class="tiny">Unlike vanilla RAG, the workflow inserts gate, audit, repair, and refusal states between retrieval and release.</text>

  <!-- Main arrows -->
  <path d="M188 191 L232 191" class="flow"/>
  <path d="M447 191 L495 191" class="flow"/>
  <path d="M685 191 L733 191" class="flow"/>
  <path d="M933 191 L980 191" class="flow"/>
  <path d="M1160 191 L1207 191" class="flow"/>
  <path d="M1437 191 L1485 191" class="flow"/>

  <text x="466" y="174" text-anchor="middle" class="small">allowed</text>
  <text x="961" y="174" text-anchor="middle" class="small">answerable / partial</text>
  <text x="1184" y="174" text-anchor="middle" class="small">safe / bounded</text>

  <!-- Refusal arrows -->
  <path d="M345 264 C350 335 570 430 772 447" class="refuse"/>
  <text x="420" y="337" class="small">blocked</text>

  <path d="M838 264 C838 315 860 350 887 373" class="refuse"/>
  <text x="700" y="322" class="small">insufficient evidence</text>

  <path d="M1075 264 C1068 320 1028 359 982 387" class="refuse"/>
  <text x="1090" y="330" class="small">unsafe</text>

  <path d="M1530 264 C1390 330 1225 410 1042 444" class="refuse"/>
  <text x="1212" y="396" class="small">unrepairable</text>
  <text x="1212" y="422" class="small">grounding failure</text>

  <!-- Repair loop -->
  <path d="M1606 264 L1606 382" class="repair"/>
  <path d="M1666 392 C1707 343 1711 303 1648 266" class="repair"/>
  <text x="1664" y="330" class="small">citation / grounding issue</text>
</svg>
