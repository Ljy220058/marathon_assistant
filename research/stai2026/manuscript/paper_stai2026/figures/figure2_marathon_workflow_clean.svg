<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
<title id="title">Marathon Training Plan Workflow Architecture</title>
<desc id="desc">A four-layer workflow diagram for marathon training plan intake, runner context construction, plan drafting, and review.</desc>
<style>
  text{font-family:Arial,Helvetica,sans-serif;fill:#1f2933}
  .title{font-size:28px;font-weight:700}
  .layer-title{font-size:18px;font-weight:700;fill:#263238}
  .node-label{font-size:17px;font-weight:600}
  .small{font-size:12px;fill:#667085}
  .layer{fill:#ffffff;stroke:#d5d9e2;stroke-width:1.6;stroke-dasharray:6 5}
  .node{rx:10;ry:10;stroke-width:2}
  .arrow{fill:none;stroke:#6b7280;stroke-width:2.1;marker-end:url(#arrow)}
  .soft-arrow{fill:none;stroke:#8a93a3;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow-soft)}
  .review-arrow{fill:none;stroke:#c2410c;stroke-width:2.4;stroke-dasharray:8 5;marker-end:url(#arrow-review)}
  .guard-arrow{fill:none;stroke:#1d4ed8;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#arrow-blue)}
</style>

<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/>
  </marker>
  <marker id="arrow-soft" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#8a93a3"/>
  </marker>
  <marker id="arrow-review" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#c2410c"/>
  </marker>
  <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#1d4ed8"/>
  </marker>
</defs>

<rect width="100%" height="100%" fill="#fbfcfe"/>
<text x="40" y="58" class="title">Marathon Training Plan Workflow Architecture</text>
<text x="40" y="86" class="small">Structured intake, evidence-bounded planning, and final delivery review</text>

<!-- Layers -->
<rect x="28" y="110" width="1544" height="150" class="layer"/>
<rect x="28" y="285" width="1544" height="300" class="layer"/>
<rect x="28" y="610" width="1544" height="300" class="layer"/>
<rect x="28" y="935" width="1544" height="210" class="layer"/>

<text x="48" y="140" class="layer-title">Layer 1: Intake and Routing</text>
<text x="48" y="315" class="layer-title">Layer 2: Runner Context and Constraints</text>
<text x="48" y="640" class="layer-title">Layer 3: Plan Drafting</text>
<text x="48" y="965" class="layer-title">Layer 4: Review and Delivery</text>

<!-- Layer 1 -->
<polygon points="394,160 518,160 576,198 518,236 394,236 336,198" fill="#d8e6f3" stroke="#4a6fa5" stroke-width="2"/>
<text x="402" y="204" class="node-label">Safety Check</text>

<polygon points="764,156 920,198 764,240 608,198" fill="#e1e7f6" stroke="#5067b0" stroke-width="2"/>
<text x="704" y="204" class="node-label">Request Routing</text>

<polygon points="1228,166 1300,166 1340,198 1300,230 1228,230 1188,198" fill="#f7d8d6" stroke="#b42318" stroke-width="2"/>
<text x="1220" y="204" class="node-label">Escalate</text>

<path d="M576 198 L608 198" class="arrow"/>
<path d="M920 198 C1035 198,1090 198,1188 198" class="guard-arrow"/>

<!-- Layer 2 -->
<rect x="540" y="345" width="230" height="62" class="node" fill="#fae3bd" stroke="#c76716"/>
<text x="596" y="383" class="node-label">Runner Profile</text>

<rect x="935" y="345" width="235" height="62" class="node" fill="#dfeecf" stroke="#6b8e23"/>
<text x="990" y="383" class="node-label">Detail Parsing</text>

<rect x="693" y="455" width="305" height="62" class="node" fill="#fbd8c9" stroke="#c96a2e"/>
<text x="764" y="493" class="node-label">Reference Lookup</text>

<rect x="662" y="542" width="370" height="62" class="node" fill="#f8cf78" stroke="#c46b00"/>
<text x="752" y="580" class="node-label">Training Constraints</text>

<ellipse cx="210" cy="424" rx="96" ry="26" fill="#e8d8f0" stroke="#7b5198" stroke-width="2"/>
<rect x="114" y="424" width="192" height="92" fill="#e8d8f0" stroke="#7b5198" stroke-width="2"/>
<ellipse cx="210" cy="516" rx="96" ry="26" fill="#e8d8f0" stroke="#7b5198" stroke-width="2"/>
<text x="149" y="475" class="node-label">Runner History</text>

<path d="M306 466 C385 420,455 384,540 376" class="soft-arrow"/>
<path d="M770 376 L935 376" class="arrow"/>
<path d="M655 407 C655 430,730 438,795 455" class="arrow"/>
<path d="M1052 407 C1038 440,980 445,912 455" class="arrow"/>
<path d="M846 517 L846 542" class="arrow"/>

<!-- Layer 3 -->
<rect x="686" y="660" width="230" height="66" class="node" fill="#c6dfc8" stroke="#3d7d45"/>
<text x="729" y="700" class="node-label">Plan Coordinator</text>

<rect x="100" y="762" width="195" height="62" class="node" fill="#b6d9b8" stroke="#2f6f39"/>
<text x="135" y="800" class="node-label">Schedule Builder</text>

<rect x="325" y="762" width="205" height="62" class="node" fill="#d8ebf7" stroke="#4d7f9d"/>
<text x="369" y="800" class="node-label">Workout Details</text>

<rect x="560" y="762" width="205" height="62" class="node" fill="#eadcf8" stroke="#7661a8"/>
<text x="601" y="800" class="node-label">Fueling Guidance</text>

<rect x="795" y="762" width="210" height="62" class="node" fill="#d3e9d5" stroke="#3d7d45"/>
<text x="835" y="800" class="node-label">Mindset Support</text>

<rect x="1038" y="740" width="220" height="62" class="node" fill="#cde7e4" stroke="#27756d"/>
<text x="1083" y="778" class="node-label">Adjustment Logic</text>

<rect x="1038" y="830" width="220" height="62" class="node" fill="#d9eeeb" stroke="#27756d"/>
<text x="1084" y="868" class="node-label">Recovery Review</text>

<rect x="1320" y="760" width="190" height="62" class="node" fill="#dfecd7" stroke="#607d3b"/>
<text x="1358" y="798" class="node-label">Coaching Notes</text>

<rect x="1320" y="845" width="190" height="62" class="node" fill="#eef4ed" stroke="#78838c" stroke-width="2" stroke-dasharray="5 5"/>
<text x="1360" y="883" class="node-label">Clarify Needed</text>

<path d="M847 604 L820 660" class="arrow"/>
<path d="M686 693 C560 707,438 728,295 774" class="arrow"/>
<path d="M686 696 C610 724,560 742,530 774" class="arrow"/>
<path d="M770 726 C742 742,720 754,698 762" class="arrow"/>
<path d="M878 726 C890 740,896 750,900 762" class="arrow"/>
<path d="M916 693 C966 707,1010 726,1038 760" class="arrow"/>
<path d="M916 706 C986 754,1024 800,1038 852" class="arrow"/>
<path d="M1258 772 L1320 790" class="arrow"/>
<path d="M1258 862 L1320 876" class="soft-arrow"/>

<!-- Layer 4 -->
<rect x="166" y="1008" width="205" height="62" class="node" fill="#f5d3dd" stroke="#b34d6d"/>
<text x="212" y="1046" class="node-label">Rule Review</text>

<rect x="426" y="1008" width="205" height="62" class="node" fill="#f2becf" stroke="#a93b60"/>
<text x="478" y="1046" class="node-label">Quality Review</text>

<rect x="686" y="1008" width="205" height="62" class="node" fill="#f8dde7" stroke="#bd4e75"/>
<text x="730" y="1046" class="node-label">Safety Output</text>

<rect x="946" y="1008" width="205" height="62" class="node" fill="#fbecf2" stroke="#c7668a"/>
<text x="997" y="1046" class="node-label">Final Format</text>

<ellipse cx="1325" cy="1014" rx="78" ry="22" fill="#e8d8f0" stroke="#7b5198" stroke-width="2"/>
<rect x="1247" y="1014" width="156" height="78" fill="#e8d8f0" stroke="#7b5198" stroke-width="2"/>
<ellipse cx="1325" cy="1092" rx="78" ry="22" fill="#e8d8f0" stroke="#7b5198" stroke-width="2"/>
<text x="1265" y="1059" class="node-label">Plan Versions</text>

<path d="M371 1039 L426 1039" class="arrow"/>
<path d="M631 1039 L686 1039" class="arrow"/>
<path d="M891 1039 L946 1039" class="arrow"/>
<path d="M1151 1039 L1247 1052" class="arrow"/>

<!-- Review loops -->
<path d="M1148 830 C1148 720,945 715,846 604" class="review-arrow"/>
<path d="M1325 1014 C1325 900,1196 680,916 692" class="review-arrow"/>
<path d="M1320 876 C1170 850,1180 208,920 198" class="guard-arrow"/>

<text x="1165" y="1168" class="small">Figure 2. Marathon training plan workflow architecture</text>
</svg>
