[pytest]
testpaths = tests
python_files = test_*.py integration_*_test.py
pythonpath = apps/backend/src
addopts =
    --strict-markers
    --tb=short
norecursedirs =
    .git
    .pytest_cache
    archive
    artifacts
    data
    docs
    node_modules
    papers
    research
    apps/web/dist

# Coverage settings
    --cov=marathon_qa_assistant
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=70
